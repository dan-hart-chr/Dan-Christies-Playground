name: Build and Deploy Irsay App

on:
  push:
    branches:
      - main
      - feature/irsay-sale
    paths:
      - 'src/irsay/**'
      - '.github/workflows/build-and-deploy-irsay.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '22.x'
  APP_LOCATION: './src/irsay'
  OUTPUT_LOCATION: 'dist'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build App
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.APP_LOCATION }}/package-lock.json'

      - name: Install dependencies
        working-directory: ${{ env.APP_LOCATION }}
        run: npm ci

      - name: Lint code
        working-directory: ${{ env.APP_LOCATION }}
        run: npm run lint
        continue-on-error: true

      - name: Build application
        working-directory: ${{ env.APP_LOCATION }}
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: irsay-build
          path: ${{ env.APP_LOCATION }}/${{ env.OUTPUT_LOCATION }}
          retention-days: 7

  deploy-staging:
    runs-on: [self-hosted, linux, x64]
    name: Deploy to Staging
    needs: build
    if: github.ref == 'refs/heads/feature/irsay-sale'
    environment:
      name: STG

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: irsay-build
          path: ./dist

      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Upload to Azure Storage (Staging)
        uses: azure/CLI@v2
        with:
          inlineScript: |
            STORAGE_ACCOUNT="${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}"
            CONTAINER_NAME="${{ secrets.AZURE_STORAGE_CONTAINER_NAME}}"
            
            echo "Uploading files to Azure Storage Account: $STORAGE_ACCOUNT"
            echo "Container: $CONTAINER_NAME"

            az account set --subscription ${{ env.AZURE_SUBSCRIPTION_ID }}
            
            az storage blob upload-batch \
              --account-name $STORAGE_ACCOUNT \
              --auth-mode login \
              --destination $CONTAINER_NAME \
              --source ./dist \
              --overwrite \
              --pattern "*"
            
            echo "Setting content types..."
            az storage blob update \
              --account-name $STORAGE_ACCOUNT \
              --auth-mode login \
              --container-name $CONTAINER_NAME \
              --name "index.html" \
              --content-type "text/html" || true
            
            # echo "Setting cache control headers..."
            # az storage blob update-batch \
            #   --account-name $STORAGE_ACCOUNT \
            #   --auth-mode login \
            #   --source $CONTAINER_NAME \
            #   --pattern "assets/*" \
            #   --content-cache-control "public, max-age=31536000, immutable" || true

      - name: Azure Logout
        run: az logout
        if: always()

      
